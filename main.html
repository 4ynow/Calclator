<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="calculator">
            <input id="display" readonly>
            <div id="keys">
                <button id="symbols" onclick="calcAppendDisplay('+')">+</button>
                <button onclick="calcAppendDisplay('7')">7</button>
                <button onclick="calcAppendDisplay('8')">8</button>
                <button onclick="calcAppendDisplay('9')">9</button>
                <button id="symbols" onclick="calcAppendDisplay('-')">-</button>
                <button onclick="calcAppendDisplay('4')">4</button>
                <button onclick="calcAppendDisplay('5')">5</button>
                <button onclick="calcAppendDisplay('6')">6</button>
                <button id="symbols" onclick="calcAppendDisplay('*')">*</button>
                <button onclick="calcAppendDisplay('1')">1</button>
                <button onclick="calcAppendDisplay('2')">2</button>
                <button onclick="calcAppendDisplay('3')">3</button>
                <button id="symbols" onclick="calcAppendDisplay('/')">/</button>
                <button onclick="calcAppendDisplay('0')">0</button>
                <button onclick="calcAppendDisplay('.')">.</button>
                <button onclick="calculate()">=</button>
                <button id="symbols" onclick="clearDisplay()">C</button>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
